name: Final Vue engineering audit
on:
  push:
    branches: [verify/vue-final-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - name: Install actual Vue compiler on runner
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/vue" --no-audit --no-fund @vue/compiler-sfc@3.5.44 vue@3.5.44
          echo "IMPECCABLE_TEST_VUE_MODULES=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Production acceptance repros before fixes
        shell: bash
        run: |
          set +e
          cargo test --locked -p impeccable-live --test vue_accept -- --nocapture > compiler-audit.log 2>&1
          result=$?
          cat compiler-audit.log
          test "$result" != 0 || exit 1
          grep -F '13 passed; 6 failed' compiler-audit.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: compiler-audit-${{ runner.os }}
          path: compiler-audit.log
  browser-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/vue" --no-audit --no-fund vue@3.5.44
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium production-helper probes
        env:
          IMPECCABLE_TEST_VUE_MODULES: ${{ runner.temp }}/vue/node_modules
        run: node --test tests/live-vue-audit.test.mjs
  node22-baseline:
    strategy:
      fail-fast: false
      matrix:
        ref: [936867543ac2576920d663cc9803597f6044f3ac, 3eccf43b7c5997a3c24cca55754595a6e9494eda, cf7ea4a8fe56f3e186e9ffaca3124937e36e6430]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: vue-audit-release
      - run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build actual release engine for this revision
        run: |
          cargo build --release --locked -p impeccable
          echo "IMPECCABLE_BIN=$GITHUB_WORKSPACE/target/release/impeccable" >> "$GITHUB_ENV"
      - run: bun run build
      - name: Recheck complete Live suite without hiding failures
        shell: bash
        run: |
          set +e
          bun run test:live > live-audit.log 2>&1
          result=$?
          cat live-audit.log
          echo "Actual Live-suite exit status: $result"
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: live-baseline-${{ matrix.ref }}
          path: live-audit.log
