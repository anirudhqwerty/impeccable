name: Vue inline isolation verification
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Immutable source SHA
        required: true
      phase:
        description: baseline or validation
        required: true
        default: baseline
permissions:
  contents: read
jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: vue-inline
          cache-on-failure: true
      - name: Exact source and compiler
        shell: bash
        run: |
          git rev-parse HEAD
          npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund @vue/compiler-sfc@3.5.44 vue@3.5.44
          echo "IMPECCABLE_TEST_VUE_MODULES=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
      - name: Same-line failing baseline or passing regression
        shell: bash
        run: |
          set +e
          cargo test --locked -p impeccable-live --test vue_accept vue_inline_selection -- --nocapture > inline.log 2>&1
          result=$?
          cat inline.log
          if [ '${{ inputs.phase }}' = baseline ]; then
            test "$result" != 0 && grep -F 'generation/Tune compiled but Accept failed' inline.log && grep -F 'Vue source changed since preview' inline.log
          else
            test "$result" = 0
          fi
      - name: All Vue compiler cases
        if: inputs.phase == 'validation'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p impeccable-live --test vue_accept -- --nocapture 2>&1 | tee vue.log
      - name: Focused live crate
        if: inputs.phase == 'validation'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p impeccable-live 2>&1 | tee live.log
      - name: Dependent crates
        if: inputs.phase == 'validation' && runner.os == 'Linux'
        shell: bash
        run: |
          git fetch origin next:refs/remotes/origin/next
          bun run test:rust-changed --base origin/next
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: rust-${{ matrix.os }}-${{ inputs.phase }}
          path: |
            *.log
            target/test-rust-changed.log
  integration:
    if: inputs.phase == 'validation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      IMPECCABLE_TELEMETRY_CHANNEL: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: vue-inline-release
          cache-on-failure: true
      - run: |
          git rev-parse HEAD
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund @vue/compiler-sfc@3.5.44 vue@3.5.44
          echo "IMPECCABLE_TEST_VUE_MODULES=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
          npx playwright install --with-deps chromium
      - run: |
          cargo build --release --locked -p impeccable
          echo "IMPECCABLE_BIN=$GITHUB_WORKSPACE/target/release/impeccable" >> "$GITHUB_ENV"
      - name: Source build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
      - name: Default tests
        if: success() || failure()
        run: |
          set -o pipefail
          bun run test 2>&1 | tee default.log
      - name: Vue browser regressions
        if: success() || failure()
        env:
          IMPECCABLE_LIVE_VUE_COMPONENT: '1'
        run: |
          set -o pipefail
          bun run test:live-vue-accept 2>&1 | tee vue-browser.log
          node --test tests/live-vue-bindings.test.mjs tests/live-vue-review.test.mjs
      - name: Full owed deterministic live E2E sweep
        if: success() || failure()
        run: |
          set -o pipefail
          bun run test:live-e2e 2>&1 | tee live-e2e.log
      - name: Svelte adapter billed gate availability
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "NOT EXECUTED: Svelte adapter sweep requires DEEPSEEK_API_KEY; maintainer upstream gate." | tee svelte-adapter.log
            echo "Svelte adapter sweep NOT EXECUTED: no provider key." >> "$GITHUB_STEP_SUMMARY"
          else
            set -o pipefail
            bun run test:live-svelte-adapter-deepseek 2>&1 | tee svelte-adapter.log
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: integration-${{ matrix.node }}
          path: |
            *.log
            tests/artifacts/
