name: Vue maintainer review verification
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source revision
        required: true
        default: feat/vue-accept-parity
      phase:
        description: baseline or validation
        required: true
        default: validation
permissions:
  contents: read
jobs:
  compiler:
    if: inputs.phase == 'validation' || inputs.phase == 'focused' || inputs.phase == 'baseline'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || 'f02c95aa81217d3bd394fefa6515f9304b090dbf' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Compiler absent
        shell: bash
        run: |
          set +e
          env -u IMPECCABLE_TEST_VUE_MODULES cargo test --locked -p impeccable-live --test vue_accept -- --nocapture > absent.log 2>&1
          result=$?
          cat absent.log
          if [ '${{ inputs.phase }}' != baseline ] && [ -n '${{ inputs.phase }}' ]; then test "$result" = 0; else test "$result" != 0; fi
      - name: Install real pinned compiler
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund @vue/compiler-sfc@3.5.44 vue@3.5.44
          echo "IMPECCABLE_TEST_VUE_MODULES=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
      - name: Compiler configured
        shell: bash
        run: |
          set +e
          cargo test --locked -p impeccable-live --test vue_accept -- --nocapture > compiler.log 2>&1
          result=$?
          cat compiler.log
          if [ '${{ inputs.phase }}' != baseline ] && [ -n '${{ inputs.phase }}' ]; then test "$result" = 0; else test "$result" != 0; fi
      - name: Broken configured compiler must fail
        if: inputs.phase == 'validation'
        shell: bash
        run: |
          set +e
          IMPECCABLE_TEST_VUE_MODULES="$RUNNER_TEMP/nonexistent" cargo test --locked -p impeccable-live --test vue_accept vue_accept_preserves_tuned_values_scripts_and_bindings -- --nocapture > broken.log 2>&1
          result=$?
          cat broken.log
          test "$result" != 0
          if grep -F 'skip:' broken.log; then exit 1; fi
      - name: Rust formatting
        if: inputs.phase == 'validation'
        shell: bash
        run: rustfmt --edition 2021 --config skip_children=true --check crates/live/src/vue_component.rs crates/live/tests/vue_accept.rs
      - name: Match standard Windows temporary-file setup
        if: inputs.phase == 'validation' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $vueReviewTemp = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force -Path $vueReviewTemp | Out-Null
          "TEMP=$vueReviewTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$vueReviewTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Match standard Windows browser warmup
        if: inputs.phase == 'validation' && runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        run: |
          $vueReviewChrome = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (Test-Path $vueReviewChrome) {
            $vueReviewProfile = Join-Path $env:TEMP 'browser-warmup'
            & $vueReviewChrome --headless=new --no-sandbox --disable-gpu "--user-data-dir=$vueReviewProfile" --dump-dom about:blank | Out-Null
          }
          exit 0
      - name: Complete Rust workspace
        if: inputs.phase == 'validation'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee workspace.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: compiler-${{ runner.os }}
          path: |
            absent.log
            compiler.log
            broken.log
            workspace.log
  browser-baseline:
    if: inputs.phase == 'baseline' || inputs.phase == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f02c95aa81217d3bd394fefa6515f9304b090dbf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund vue@3.5.44
      - run: npx playwright install --with-deps chromium
      - name: Reproduce null-binding regression
        env:
          IMPECCABLE_TEST_VUE_MODULES: ${{ runner.temp }}/vue/node_modules
        run: |
          set +e
          node --test tests/live-vue-bindings.test.mjs > browser.log 2>&1
          result=$?
          cat browser.log
          test "$result" != 0
          grep -F 'null setup binding must not fall through' browser.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-baseline
          path: browser.log

  integration:
    if: inputs.phase == 'validation'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: vue-review-release
      - run: bun install --frozen-lockfile
      - name: Provision compiler and Chromium on runner
        run: |
          npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund @vue/compiler-sfc@3.5.44 vue@3.5.44
          echo "IMPECCABLE_TEST_VUE_MODULES=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
          npx playwright install --with-deps chromium
      - name: Release engine
        run: |
          cargo build --release --locked -p impeccable
          echo "IMPECCABLE_BIN=$GITHUB_WORKSPACE/target/release/impeccable" >> "$GITHUB_ENV"
      - name: Source build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
      - name: Default tests
        id: default
        run: |
          set -o pipefail
          bun run test 2>&1 | tee default.log
      - name: Live suite without hidden failures
        if: always() && steps.default.outcome != 'skipped'
        run: |
          set -o pipefail
          bun run test:live 2>&1 | tee live.log
      - name: Vue lifecycle and Chromium binding regressions
        env:
          IMPECCABLE_LIVE_VUE_COMPONENT: '1'
        if: always() && steps.default.outcome != 'skipped'
        run: |
          set -o pipefail
          bun run test:live-vue-accept 2>&1 | tee vue-browser.log
      - name: Svelte lifecycle Tune republish and top layer
        if: always() && steps.default.outcome != 'skipped'
        env:
          IMPECCABLE_E2E_ONLY: vite8-sveltekit-stateful
          IMPECCABLE_E2E_SCENARIOS: core,params,republish
        run: |
          set -o pipefail
          bun run test:live-e2e 2>&1 | tee svelte-browser.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-tests-node-${{ matrix.node }}
          path: |
            build.log
            default.log
            live.log
            vue-browser.log
            svelte-browser.log
      - name: Dependent Rust crates
        if: always() && matrix.node == '24' && steps.default.outcome != 'skipped'
        run: |
          git fetch https://github.com/pbakaus/impeccable.git main:refs/remotes/upstream/main
          set -o pipefail
          bun run test:rust-changed -- --base upstream/main 2>&1 | tee dependent-rust.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: integration-node-${{ matrix.node }}
          path: |
            *.log
            target/test-rust-changed.log
  upstream-baselines:
    if: inputs.phase == 'baseline-matrix' || inputs.phase == 'current-baseline'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.phase == 'current-baseline' && '["61e73eebd34a845df0bfef463eb0d31ed4eab581"]' || '["936867543ac2576920d663cc9803597f6044f3ac","61e73eebd34a845df0bfef463eb0d31ed4eab581"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: vue-review-baseline
      - run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build baseline release engine
        run: |
          cargo build --release --locked -p impeccable
          echo "IMPECCABLE_BIN=$GITHUB_WORKSPACE/target/release/impeccable" >> "$GITHUB_ENV"
      - name: Baseline source build
        id: baseline-build
        continue-on-error: true
        run: |
          set -o pipefail
          bun run build 2>&1 | tee baseline-build.log
      - name: Actual baseline Live suite
        run: |
          set -o pipefail
          bun run test:live 2>&1 | tee baseline-live.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: baseline-${{ matrix.ref }}
          path: baseline-live.log

  browser-focused:
    if: inputs.phase == 'focused'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund vue@3.5.44
      - run: npx playwright install --with-deps chromium
      - name: Null binding and callable snapshot regressions
        env:
          IMPECCABLE_TEST_VUE_MODULES: ${{ runner.temp }}/vue/node_modules
        run: node --test tests/live-vue-bindings.test.mjs tests/live-browser-source.test.mjs

  vue-browser-debug:
    if: inputs.phase == 'browser' || inputs.phase == 'browser-order'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMPECCABLE_LIVE_VUE_COMPONENT: '1'
      IMPECCABLE_E2E_DEBUG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: vue-review-release
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - run: |
          npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund @vue/compiler-sfc@3.5.44 vue@3.5.44
          echo "IMPECCABLE_TEST_VUE_MODULES=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
          npx playwright install --with-deps chromium
      - run: |
          cargo build --release --locked -p impeccable
          echo "IMPECCABLE_BIN=$GITHUB_WORKSPACE/target/release/impeccable" >> "$GITHUB_ENV"
      - name: Reproduce preceding default and Live suites
        if: inputs.phase == 'browser-order'
        env:
          IMPECCABLE_LIVE_VUE_COMPONENT: ''
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          bun run build
          bun run test
          bun run test:live
      - run: |
          set -o pipefail
          bun run test:live-vue-accept 2>&1 | tee vue-browser.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: vue-browser-debug
          path: vue-browser.log

  parameter-restore:
    if: inputs.phase == 'params-baseline' || inputs.phase == 'params-validation'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - name: Initial restore and remount regression
        run: |
          set +e
          node --test --test-reporter=tap tests/live-browser-source.test.mjs > params.log 2>&1
          result=$?
          cat params.log
          if [ '${{ inputs.phase }}' = params-baseline ]; then
            test "$result" != 0
            grep -F '# fail 2' params.log
          else
            test "$result" = 0
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: params-${{ matrix.node }}
          path: params.log
