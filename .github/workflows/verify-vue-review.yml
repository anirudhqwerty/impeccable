name: Vue maintainer review verification
on:
  push:
    branches: [verify/vue-review-1169]
  workflow_dispatch:
    inputs:
      ref:
        description: Source revision
        required: true
        default: feat/vue-accept-parity
      phase:
        description: baseline or validation
        required: true
        default: validation
permissions:
  contents: read
jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || 'f02c95aa' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Compiler absent
        shell: bash
        run: |
          set +e
          env -u IMPECCABLE_TEST_VUE_MODULES cargo test --locked -p impeccable-live --test vue_accept -- --nocapture > absent.log 2>&1
          result=$?
          cat absent.log
          if [ '${{ inputs.phase }}' = validation ]; then test "$result" = 0; else test "$result" != 0; fi
      - name: Install real pinned compiler
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund @vue/compiler-sfc@3.5.44 vue@3.5.44
          echo "IMPECCABLE_TEST_VUE_MODULES=$RUNNER_TEMP/vue/node_modules" >> "$GITHUB_ENV"
      - name: Compiler configured
        shell: bash
        run: |
          set +e
          cargo test --locked -p impeccable-live --test vue_accept -- --nocapture > compiler.log 2>&1
          result=$?
          cat compiler.log
          if [ '${{ inputs.phase }}' = validation ]; then test "$result" = 0; else test "$result" != 0; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: compiler-${{ runner.os }}
          path: |
            absent.log
            compiler.log
  browser-baseline:
    if: inputs.phase != 'validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f02c95aa
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/vue" --ignore-scripts --no-audit --no-fund vue@3.5.44
      - run: npx playwright install --with-deps chromium
      - name: Reproduce null-binding regression
        env:
          IMPECCABLE_TEST_VUE_MODULES: ${{ runner.temp }}/vue/node_modules
        run: |
          set +e
          node --test tests/live-vue-bindings.test.mjs > browser.log 2>&1
          result=$?
          cat browser.log
          test "$result" != 0
          grep -F 'null setup binding must not fall through' browser.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-baseline
          path: browser.log
