name: Verify Vue contribution with release engine
on:
  push:
    branches: [verify/386-release]
permissions:
  contents: read
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: feature-node-floor
            ref: 3eccf43b7c5997a3c24cca55754595a6e9494eda
            node: '22.18.0'
            suite: test
          - label: upstream-latest-node-22
            ref: 936867543ac2576920d663cc9803597f6044f3ac
            node: '22'
            suite: test:live
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: vue-accept-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-release-v1
          restore-keys: vue-accept-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install runner-only repository tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: bun install --frozen-lockfile
      - name: Build release engine from source
        run: |
          cargo build --release --locked -p impeccable
          echo "IMPECCABLE_BIN=$GITHUB_WORKSPACE/target/release/impeccable" >> "$GITHUB_ENV"
      - name: Source-first build
        run: bun run build
      - name: Default suites and oracle against changed release engine
        run: bun run ${{ matrix.suite }}
